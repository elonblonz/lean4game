# CI for our fork's branches (upstream's `test.yml` only runs for `main`).
name: Fork CI
run-name: Test ${{ github.ref_name }}
on:
  workflow_dispatch:
  push:
    branches:
      - stg4-ui
      - stg4-next
  pull_request:
    branches:
      - stg4-ui
      - stg4-next
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  NODE_VERSION: 26
jobs:
  build:
    name: Build and relay tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build the relay and the client
        run: |
          npm run build:relay
          npm run build:client

      - name: Run relay unit tests
        run: npm --workspace relay run test

  cypress:
    name: Cypress (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Installs the toolchain of `server/lean-toolchain` and builds `GameServer` (as upstream's
      # `test.yml` does); `cypress/TestGame` uses it as a local dependency.
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          build: true
          test: true
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
          check-reservoir-eligibility: false
          lake-package-directory: "server"

      - name: Build the project
        run: |
          npm ci
          npm run build:relay
          npm run build:client
          npm run build:test

      - name: Run Cypress tests (Development mode)
        run: npm run test

      - name: Install Bubblewrap
        run: sudo apt-get install bubblewrap

      - name: Configure AppArmor for Bubblewrap (https://etbe.coker.com.au/2024/04/24/ubuntu-24-04-bubblewrap/)
        run: |
          sudo tee /etc/apparmor.d/bwrap > /dev/null << 'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,

            # Site-specific additions and overrides. See local/README for details.
            include if exists <local/bwrap>
          }
          EOF
          sudo systemctl reload apparmor

      - name: Run Cypress tests (Production mode)
        run: npm run test:prod

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7
          if-no-files-found: ignore
